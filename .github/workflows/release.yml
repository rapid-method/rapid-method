name: Release

# Publishes to npm when a version tag (vX.Y.Z) is pushed.
#
# Auth is OpenID Connect (npm trusted publishing) — there is no long-lived
# token in this repository. npm accepts the publish because the package lists
# this org, this repo and this workflow filename as a trusted publisher; the
# credential is minted per run and expires with it.
#
# Prerequisite: on npmjs.com, the `rapid-method` package has a trusted
# publisher configured as rapid-method/rapid-method + release.yml, with
# `npm publish` allowed. Renaming this file breaks that link.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release
  id-token: write # mint the OIDC token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, and Node 22 still ships npm 10.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm test

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
